services:
  - type: web
    name: dev-burger-api
    runtime: node
    plan: free
    rootDir: dev-burger-api
    buildCommand: yarn install --frozen-lockfile && yarn migrate
    startCommand: yarn start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dev-burger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://brunorivaroli.github.io
      - key: API_URL
        sync: false

databases:
  - name: dev-burger-db
    plan: free
    databaseName: devburger
    user: devburger
