name: Deploy front para GitHub Pages

on:
  push:
    branches: [main]
    paths: ['dev-burger-front/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev-burger-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: dev-burger-front/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          VITE_BASE_PATH: /dev-burger/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      # fallback de SPA: rotas como /login recarregam o index.html
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dev-burger-front/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
